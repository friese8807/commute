<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출발 도우미</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="출발">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f8fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1821" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180-v1.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v1.png">
<link rel="manifest" href="manifest.webmanifest?v=1">
<style>
/* ═══ app-kit.css — 모바일 웹앱 공통 (화면 채우기 · 로딩 · 스와이프 · 시트) ═══
   색은 :root 의 토큰만 바꿔서 앱마다 맞춘다. --solid 는 탭바/하단 띠 색이며 html 배경과 같아야 한다. */
:root{
  --bg:#f3f5f8; --solid:#ffffff; --ink:#12151c; --muted:#6b7280; --line:rgba(18,21,28,.10);
  --accent:#3b6cf6; --danger:#e5484d;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#10141b; --solid:#171c25; --ink:#f2f4f8; --muted:#9aa3b2; --line:rgba(255,255,255,.12); color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ── 1. 화면 채우기 (위아래 공백 제거) ──
   · html 배경 = 하단 띠 색(--solid): 아이폰이 그리지 않는 맨 아래 칸이 탭바와 이어져 보인다.
   · 문서는 스크롤하지 않고(#sc 만 스크롤) 탭바는 fixed 가 아닌 flex 맨 아래 칸에 둔다.
   · --app-h 는 app-kit.js 의 fixViewport() 가 실제 화면 높이로 넣어 준다. */
html{height:100%;background:var(--solid);overflow:hidden}
body{margin:0;height:var(--app-h,100%);overflow:hidden;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);overscroll-behavior:none;-webkit-text-size-adjust:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
.ak-top{flex:none;display:flex;align-items:center;gap:8px;background:var(--bg);
  padding:calc(8px + var(--sat)) max(16px,var(--sar)) 8px max(16px,var(--sal))}
.ak-top h1{flex:1;margin:0;font-size:20px;font-weight:800}
#sc{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding:4px max(16px,var(--sar)) 20px max(16px,var(--sal))}
.ak-tabs{flex:none;display:flex;background:var(--solid);border-top:1px solid var(--line);
  padding:6px max(8px,var(--sar)) max(6px,calc(var(--sab) - 14px)) max(8px,var(--sal))}
.ak-tabs button{flex:1;border:0;background:none;font:inherit;font-size:11px;font-weight:600;color:var(--muted);
  padding:6px 0;display:grid;gap:2px;justify-items:center;cursor:pointer}
.ak-tabs button .i{font-size:20px;line-height:1}
.ak-tabs button.on{color:var(--accent)}
/* 아이폰은 16px 보다 작은 입력칸을 누르면 화면을 확대한다 */
input,select,textarea{font-size:16px}
/* 키보드가 올라와 있는 동안 아래 여백 (AppKit.keyboardSafe) */
body.kb #sc{padding-bottom:50vh}
button{touch-action:manipulation}

/* ── 2. 로딩 ── */
/* 2-1 첫 화면: JS 가 뜨기 전부터 보이는 아이콘 + 문구 */
.ak-boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);text-align:center;transition:opacity .25s}
.ak-boot.out{opacity:0;pointer-events:none}
.ak-boot img{width:84px;height:84px;border-radius:20px;animation:ak-breathe 1.6s ease-in-out infinite}
.ak-boot p{margin:14px 0 0;color:var(--muted);font-size:14px}
@keyframes ak-breathe{50%{transform:scale(.94);opacity:.75}}
/* 2-2 누른 동작 처리 중: 위쪽 진행 막대 + 알약 + 누른 버튼 스피너 */
.ak-bar{position:fixed;left:0;right:0;top:0;height:3px;z-index:60;pointer-events:none;opacity:0;transition:opacity .2s;overflow:hidden;
  background:color-mix(in srgb,var(--accent) 18%,transparent)}
.ak-bar.on{opacity:1}
.ak-bar::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-40%;border-radius:3px;background:var(--accent);animation:ak-bar 1.1s ease-in-out infinite}
@keyframes ak-bar{to{left:100%}}
.ak-pill,.ak-toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));z-index:61;transform:translate(-50%,12px);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:600;
  padding:9px 16px;border-radius:999px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 6px 24px rgba(0,0,0,.22)}
.ak-pill{display:flex;align-items:center;gap:8px}
.ak-pill.on,.ak-toast.on{opacity:1;transform:translate(-50%,0)}
.ak-pill.top{top:calc(14px + var(--sat));bottom:auto}
.ak-pill .e{display:inline-block;animation:ak-hop .5s ease-in-out infinite alternate}
@keyframes ak-hop{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-4px) rotate(6deg)}}
.ak-pill .d i{display:inline-block;width:4px;height:4px;margin-left:3px;border-radius:50%;background:currentColor;animation:ak-dot 1.2s infinite}
.ak-pill .d i:nth-child(2){animation-delay:.2s}.ak-pill .d i:nth-child(3){animation-delay:.4s}
@keyframes ak-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.is-busy{position:relative;pointer-events:none;opacity:.6}
.is-busy::after{content:"";position:absolute;right:12px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;
  border:2px solid currentColor;border-right-color:transparent;animation:ak-spin .7s linear infinite}
/* 2-3 배경 새로고침: 새로고침 아이콘만 돈다 */
.ak-icon-btn{border:0;background:none;color:inherit;font-size:20px;width:40px;height:40px;border-radius:50%;cursor:pointer;display:inline-grid;place-items:center;padding:0}
/* 아이콘만 정확히 가운데 축으로 돈다 (버튼째 돌리면 꿀렁거림) */
.ak-icon-btn svg{display:block;transform-origin:50% 50%;will-change:transform}
.ak-spin{animation:ak-spin .8s linear infinite}
@keyframes ak-spin{to{transform:rotate(360deg)}}

/* ── 3. 스와이프 ── */
.ak-in-l{animation:ak-in-l .22s ease-out}.ak-in-r{animation:ak-in-r .22s ease-out}
@keyframes ak-in-l{from{transform:translateX(28px);opacity:0}}
@keyframes ak-in-r{from{transform:translateX(-28px);opacity:0}}
.ak-hscroll{overflow-x:auto;scrollbar-width:none;touch-action:pan-x;overscroll-behavior:contain}
.ak-hscroll::-webkit-scrollbar{display:none}

/* ── 4. 바텀시트 (끌어서 열고 닫기) ── */
.ak-scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.ak-scrim.on{opacity:1;pointer-events:auto}
.ak-sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  background:var(--solid);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding:0 max(18px,var(--sar)) calc(18px + var(--sab)) max(18px,var(--sal))}
.ak-sheet.on{transform:translateY(0)}
.ak-sheet.dragging{transition:none}
/* 시트 아래로 같은 색을 이어 붙여 아이폰 하단 틈을 가린다 */
.ak-sheet::after{content:"";position:absolute;left:0;right:0;top:calc(100% - 1px);height:200px;background:var(--solid)}
.ak-grab{flex:none;padding:8px 0 12px;touch-action:none;cursor:grab}
.ak-grab::before{content:"";display:block;width:40px;height:5px;border-radius:9px;margin:0 auto;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.ak-sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

@media (prefers-reduced-motion:reduce){
  .ak-bar::before,.ak-pill .e,.ak-pill .d i,.is-busy::after,.ak-spin,.ak-boot img{animation-duration:2.5s}
  .ak-in-l,.ak-in-r{animation:none}.ak-sheet,.ak-scrim{transition:none}
}

/* ── 5. 상태·오류·예시 표시 ── */
/* 숫자는 자릿수가 흔들리지 않게 */
.num{font-variant-numeric:tabular-nums}
/* 갱신 상태: <span class="ak-status"><i class="ak-dot live"></i>14:32 갱신</span> */
.ak-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ak-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.ak-dot.live{background:#22c55e;animation:ak-pulse 1.8s infinite}
.ak-dot.off{background:var(--danger)}
@keyframes ak-pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
/* 예시 데이터로 보는 중 */
.ak-demo{flex:none;background:var(--ink);color:var(--bg);text-align:center;font-size:12.5px;padding:calc(6px + var(--sat)) 6px 6px}
.ak-demo:not([hidden]) + .ak-top{padding-top:8px}
/* 앱 오류 */
.ak-err{flex:none;background:var(--danger);color:#fff;font-size:12.5px;line-height:1.4;padding:calc(6px + var(--sat)) 12px 6px;overflow-wrap:anywhere}
/* 빈 화면·불러오기 실패 */
.ak-empty{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;padding:36px 16px}
/* 설명 글은 가운데 정렬 + 낱말 중간에서 끊지 않기(한글 기본값은 글자 단위로 끊긴다) + 줄 길이 고르게.
   칸보다 긴 낱말(주소·코드)만 그 안에서 끊는다. 손으로 <br>을 넣어 맞추지 않는다 */
.ak-center,.note,.ak-empty,.ak-demo{word-break:keep-all;overflow-wrap:break-word;text-wrap:balance}
.ak-center,.note{text-align:center}
.ak-empty button{margin-top:12px;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:inherit;font-weight:600;border-radius:10px;padding:8px 16px}
/* 선 아이콘: <svg class="ak-ic" viewBox="0 0 24 24"><path …/></svg> — 글자색을 따라간다 */
.ak-ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){.ak-dot.live{animation:none}}
/* ── 이 앱의 색: 파스텔 '하늘' (올포오션에서 고른 색감) ── */
:root{ --accent:#4f93c9; --on-accent:#fff; --bg:#f3f8fc; --solid:#ffffff; --chip:#e9f2fa; --top-bg:#d6e9f7; --top-ink:#1f4d70;
  --soft:#eef5fb; --bar:#bcd6ec; --best:#4f93c9; --now:#e0794f; --p-go:#dff3e6; --p-go-ink:#1d6b3c; --p-warn:#fdf0d8; --p-warn-ink:#8a5a12; }
@media (prefers-color-scheme:dark){ :root{ --accent:#8cc0e8; --on-accent:#0d2436; --bg:#0f1821; --solid:#16222e; --chip:#1c2d3d;
  --top-bg:#18304a; --top-ink:#cfe4f5; --soft:#1a2836; --bar:#2f4a63; --best:#8cc0e8; --now:#f0a07c; --p-go:#163526; --p-go-ink:#9fdcb4; --p-warn:#3a2e17; --p-warn-ink:#f1cf8f; } }
html{background:var(--solid)}
.ak-top{background:var(--top-bg);color:var(--top-ink)}
.ak-top .ak-status{color:var(--top-ink);opacity:.8}
.ak-tabs .ak-ic{width:22px;height:22px}
/* ── 공통 모양 ── */
.card{background:var(--solid);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px}
.card h2{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:6px}
.card,.note,.why,.ak-empty{word-break:keep-all;overflow-wrap:break-word}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;padding:13px;margin-top:12px;cursor:pointer;min-height:46px}
.btn.sub{background:var(--chip);color:var(--ink)}
.diag{color:var(--muted);font-size:11px;line-height:1.5;margin-top:16px;text-align:center}
.mut{color:var(--muted)}
.note{color:var(--muted);font-size:12.5px;line-height:1.55;margin:8px 4px 12px}
/* 길 고르기 칩 */
.chips{display:flex;gap:6px;margin:10px 0 4px}
.chip{flex:1;min-width:0;border:1px solid transparent;background:var(--chip);color:var(--ink);font:inherit;border-radius:14px;padding:8px 4px;cursor:pointer;display:grid;gap:1px;justify-items:center;min-height:52px}
.chip b{font-size:13.5px;white-space:nowrap}.chip small{font-size:11px;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--accent);color:var(--on-accent)}.chip.on small{color:inherit;opacity:.85}
.why{text-align:center;font-size:12.5px;color:var(--muted);margin:6px 0 12px;word-break:keep-all;text-wrap:balance}
.why b{color:var(--ink)}
.base{display:flex;justify-content:center;gap:6px;margin:-4px 0 12px}
.base button{border:1px solid var(--line);background:var(--solid);color:var(--muted);font:inherit;font-size:12.5px;font-weight:600;border-radius:999px;padding:6px 12px;min-height:34px}
.base button.on{border-color:var(--accent);color:var(--ink);background:var(--soft)}
.herebtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:6px 0 0;border:1.5px dashed var(--accent);background:var(--solid);color:var(--ink);font:inherit;font-size:14px;font-weight:700;border-radius:14px;padding:10px;min-height:44px}
.herebtn.on{border-style:solid;background:var(--soft)}
/* 정보 칸 3개 */
.facts{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:8px}
.fact{background:var(--soft);border-radius:12px;padding:9px 10px;min-width:0}
.fact small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.fact b{font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
/* 추천 띠 */
.best{display:flex;gap:10px;align-items:center;background:var(--p-go);color:var(--p-go-ink);border-radius:14px;padding:11px 13px;margin:12px 0 0;font-size:14px;line-height:1.4}
.best .ak-ic{flex:none;width:22px;height:22px}
.best.same{background:var(--soft);color:var(--ink)}
.best b{font-weight:800}
/* ── A 큰 숫자형 ── */
.hero{text-align:center;padding:20px 16px 16px}
.hero .lb{font-size:13px;color:var(--muted);font-weight:600}
.hero .big{font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0 2px}
.hero .big small{font-size:24px;font-weight:700;margin:0 2px}
.hero .arr{font-size:17px;font-weight:700}
.hero .arr span{color:var(--muted);font-weight:600}
.bch{display:grid;grid-template-columns:34px 1fr;margin:18px 0 4px}
.bch .ya{position:relative}
.bch .ya span{position:absolute;right:6px;transform:translateY(-50%);font-size:10.5px;color:var(--muted);white-space:nowrap}
.bch .pl{position:relative;height:140px}
.bch .gl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:3px}
.bars button{flex:1;border:0;padding:0;background:var(--bar);border-radius:5px 5px 2px 2px;cursor:pointer;position:relative;min-width:0}
.bars button.best{background:var(--best)}
.bars button.now{background:var(--now)}
/* C 시간표 */
.tt2{list-style:none;margin:0;padding:0}
.tt2 li{display:grid;grid-template-columns:52px 1fr auto 66px;align-items:center;gap:8px;padding:11px 6px;border-top:1px solid var(--line);font-size:15px;border-radius:10px}
.tt2 li:first-child{border-top:0}
.tt2 .t{font-weight:700;color:var(--muted)}.tt2 b{font-size:16.5px}.tt2 .r{font-size:13.5px;color:var(--muted)}
.tt2 em{font-style:normal;font-size:12px;font-weight:700;text-align:right;color:var(--muted)}
.tt2 li.now{background:color-mix(in srgb,var(--now) 14%,transparent)}.tt2 li.now .t{color:var(--now)}
.tt2 li.best{background:var(--p-go)}.tt2 li.best em,.tt2 li.best b{color:var(--p-go-ink)}
.legend.rl{flex-wrap:wrap;gap:4px 12px}
.bars button.sel{outline:2px solid var(--ink);outline-offset:1px}
.bars button em{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);z-index:1;font-style:normal;font-size:10.5px;font-weight:700;white-space:nowrap;margin-bottom:2px;color:var(--ink)}
.bx{position:relative;height:16px;font-size:10.5px;color:var(--muted);margin-left:34px}
.bars button em.l{left:0;transform:none}.bars button em.r{left:auto;right:0;transform:none}
.bars button em.mx{color:var(--danger)}.bars button em.mn{color:var(--p-go-ink)}
.bx span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.pick{margin-top:8px;text-align:center;font-size:13.5px;min-height:20px}
.legend{display:flex;justify-content:center;gap:12px;font-size:11.5px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* ── 길 지도 (실시간 막힘 색) ── */
.map{position:relative;height:220px;border-radius:14px;overflow:hidden;background:var(--soft);margin-top:4px}
.map.big{height:62vh}
.map svg{display:block;width:100%;height:100%}
.map .gr{stroke:var(--line);stroke-width:1}
.map .cs{fill:none;stroke:var(--solid);stroke-linecap:round;stroke-linejoin:round}
.map .rt{fill:none;stroke-linecap:round;stroke-linejoin:round}
.map .pin{stroke:var(--solid);stroke-width:3}
.map .pl{pointer-events:none;font-size:11px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--solid);stroke-width:3px}
.map .jl{font-size:10.5px;font-weight:800;paint-order:stroke;stroke:var(--solid);stroke-width:3px}
.mapw{position:relative}
.mapw .ov{position:absolute;right:8px;top:8px;display:flex;gap:6px;z-index:5}
.mapw .ov button{border:0;background:var(--solid);color:var(--ink);font:inherit;font-size:12px;font-weight:700;border-radius:10px;padding:6px 10px;box-shadow:0 1px 4px rgba(0,0,0,.18);min-height:32px}
.mapw .ov button.on{background:var(--accent);color:var(--on-accent)}
.pop{position:relative;font-size:13.5px;line-height:1.45;word-break:keep-all;overflow-wrap:break-word;color:var(--ink)}
.pop .px{position:absolute;right:-6px;top:-8px;border:0;background:none;color:var(--muted);font-size:22px;width:36px;height:36px;cursor:pointer}
.pop .pt1{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding-right:28px}.pop .pt1 b{font-size:15px}
.pop .pt2{font-size:12.5px;color:var(--muted);margin-top:3px}.pop p{margin:6px 0 0}.pop .pt3{font-size:11.5px;color:var(--muted);margin-top:6px}
#sheetBody .pop{padding:4px 2px 8px;font-size:15px}
.map .why2{position:absolute;left:8px;bottom:6px;font-size:10.5px;color:var(--muted)}
.tbar{position:relative;display:flex;align-items:center;margin:20px 14px 4px;height:26px}

<body>
<div class="ak-boot"><div><img src="icon-180-v1.png" alt=""><p>길을 살펴보는 중…</p></div></div>

<header class="ak-top">

  <button type="button" data-tab="set"><span class="i"><svg class="ak-ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></span>설정</button>

<div class="ak-sheet" id="sheet"><div class="ak-grab"></div><div class="body" id="sheetBody"></div></div>
<script>
/* ═══ app-kit.js — 모바일 웹앱 공통 동작 ═══
   AppKit.fixViewport({gap})       화면 높이 보정 (아이폰 홈 화면 앱 위아래 공백 제거). 탭바가 화면 아래로 잘리면 {gap:false}
   AppKit.bootDone()               첫 로딩 화면 걷기
   AppKit.track(promise, opts)     진행 막대 + 알약 + 누른 버튼 스피너
   AppKit.wrap(fn, skip)           API 함수를 감싸 "방금 누른 동작"만 자동으로 진행 표시
   AppKit.spin(el, promise)        새로고침 아이콘 돌리기 (아이콘만 가운데 축으로, 멈출 땐 한 바퀴 마저 돌고 0도에서)
   AppKit.keyboardSafe()           입력칸을 누르면 키보드에 가리지 않게 여백 + 가운데로
   AppKit.toast(msg)               짧은 알림
   AppKit.swipe(el, {onNext,onPrev})  좌우 스와이프 (탭·날짜 넘기기)
   AppKit.tabs({...})              탭바 + 스와이프 + 넘김 애니메이션
   AppKit.sheet(el)                바텀시트 열기/닫기 + 끌어내려 닫기
   AppKit.autoUpdate(build)        version.txt 가 바뀌면 새 버전으로 다시 열기
   AppKit.env()                    진단 문구 (버전·홈 화면 앱 여부·화면 크기)
   AppKit.store('앱접두어')         localStorage 를 안전하게 (get/set/del)
   AppKit.esc / num / krw / signed / kstDate / addDays / hhmm   글자·숫자·날짜
   AppKit.poll(fn, ms, busy)       화면이 보일 때만 자동 새로고침 + 돌아오면 즉시
   AppKit.editing(view)            입력 중인지 (배경 새로고침이 입력값을 지우지 않게)
   AppKit.sequence()               늦게 온 예전 응답 버리기
   AppKit.showErrors(build)        앱 오류를 화면에 표시
   AppKit.sure(btn)                두 번 눌러야 지워지는 버튼
   AppKit.copy(text) / buzz()      복사 · 진동
   AppKit.toJpeg(file, maxSide)    사진 줄여서 올리기
   AppKit.device()                 접속 기록용 기기·방식 */
const AppKit = (() => {
  const $ = s => typeof s === 'string' ? document.querySelector(s) : s;
  const root = document.documentElement;
  const standalone = () => !!navigator.standalone || matchMedia('(display-mode: standalone)').matches;

  /* ── 1. 화면 높이 ──
     아이폰 홈 화면 앱은 웹 화면(innerHeight)을 실제 화면보다 짧게 잡을 때가 있다.
     그 차이(gap)만큼 문서 높이를 늘려 맨 아래 빈 띠를 없앤다. 가로 모드·브라우저에서는 보정하지 않는다. */
  let gap = 0;
  /* 주의(개찰알림 2026-11, iOS 홈 화면 앱·상태바 default): raw 가 상태바 높이만큼 잡혀 문서가 화면보다 길어지고
     탭바가 화면 아래로 잘렸다. 그런 기기에서는 fixViewport({ gap:false }) 로 보정을 끈다(남는 띠는 html 배경=탭바 색이라 이어져 보인다). */
  function fixViewport({ gap: useGap = true } = {}) {
    const set = () => {
      const portraitH = Math.max(screen.height, screen.width);
      const raw = innerHeight < innerWidth ? 0 : portraitH - innerHeight;
      gap = useGap && standalone() && raw > 0 && raw < 160 ? raw : 0;
      root.style.setProperty('--app-h', (innerHeight + gap) + 'px');
      root.classList.toggle('standalone', standalone());
    };
    set();
    addEventListener('resize', set);
    addEventListener('orientationchange', () => setTimeout(set, 300));
  }

  /* ── 2. 로딩 ── */
  function bootDone() { const b = $('.ak-boot'); if (!b) return; b.classList.add('out'); setTimeout(() => b.remove(), 300); }

  let tapAt = 0, tapEl = null, busyN = 0, pillTm = 0, busyLabel = '잠깐만요, 처리 중이에요', busyEmoji = '⏳';
  ['pointerdown', 'change'].forEach(t => document.addEventListener(t, e => {
    tapAt = Date.now();
    if (t === 'pointerdown') tapEl = e.target.closest?.('button,label,.btn,[role=button]') || null;
  }, true));
  function busyUI(on, label) {
    let bar = $('.ak-bar'), pill = $('.ak-pill');
    if (on) {
      if (!bar) { bar = document.createElement('div'); bar.className = 'ak-bar'; document.body.appendChild(bar); }
      if (!pill) { pill = document.createElement('div'); pill.className = 'ak-pill'; pill.setAttribute('role', 'status'); document.body.appendChild(pill); }
      pill.innerHTML = `<span class="e">${busyEmoji}</span><span></span><span class="d"><i></i><i></i><i></i></span>`;
      pill.children[1].textContent = label || busyLabel;
      pill.classList.toggle('top', !!$('.ak-sheet.on'));           // 시트가 열려 있으면 버튼을 가리지 않게 위로
      requestAnimationFrame(() => bar.classList.add('on'));
      clearTimeout(pillTm); pillTm = setTimeout(() => pill.classList.add('on'), 350);   // 금방 끝나면 알약은 안 띄움
    } else {
      clearTimeout(pillTm); bar?.classList.remove('on'); pill?.classList.remove('on');
      document.querySelectorAll('.is-busy').forEach(x => x.classList.remove('is-busy'));
    }
  }
  function track(p, { el, label } = {}) {
    busyN++; const b = $(el) || tapEl; if (b && document.contains(b)) b.classList.add('is-busy'); busyUI(true, label);
    const done = () => { if (--busyN <= 0) { busyN = 0; busyUI(false); } };
    p.then(done, done); return p;
  }
  /* 사용자가 누른 지 1.5초 안에 시작된 요청만 표시한다. 배경 새로고침은 조용히. */
  function wrap(fn, skip) {
    return function (...a) {
      const p = fn.apply(this, a);
      if (Date.now() - tapAt > 1500 || (skip && skip(...a))) return p;
      return track(p);
    };
  }
  /* 버튼째 돌리면 축이 어긋나 꿀렁거리고, 응답이 오는 순간 멈추면 0도로 툭 튄다(개찰알림에서 지적).
     → 안의 svg 만 돌리고, 끝나면 돌던 바퀴를 마저 돈 뒤(animationiteration) 멈춘다. 여러 요청이 겹쳐도 마지막이 끝날 때까지 돈다 */
  function spin(el, p) {
    el = $(el); if (!el) return p;
    const ic = el.querySelector('svg') || el;
    ic.dataset.spinN = (+ic.dataset.spinN || 0) + 1;
    ic.classList.add('ak-spin');
    const off = () => {
      if (--ic.dataset.spinN > 0) return;
      const stop = () => { if (+ic.dataset.spinN <= 0) ic.classList.remove('ak-spin'); };
      ic.addEventListener('animationiteration', stop, { once: true });
      setTimeout(stop, 2600);
    };
    p.then(off, off); return p;
  }
  /* 입력칸이 화면 아래쪽이면 키보드에 가려 누를 수 없었다(개찰알림 설정 탭) → 누르는 동안 아래 여백을 늘리고 그 칸을 가운데로 */
  function keyboardSafe(view = '#sc') {
    const sel = view + ' input,' + view + ' select,' + view + ' textarea';
    document.addEventListener('focusin', e => {
      if (!e.target.matches?.(sel)) return;
      document.body.classList.add('kb');
      setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 350);
    });
    document.addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement?.matches?.(sel)) document.body.classList.remove('kb'); }, 200));
  }
  function setBusy({ label, emoji } = {}) { if (label) busyLabel = label; if (emoji) busyEmoji = emoji; }

  let toastTm = 0;
  function toast(msg, ms = 2400) {
    let t = $('.ak-toast');
    if (!t) { t = document.createElement('div'); t.className = 'ak-toast'; t.setAttribute('role', 'status'); t.setAttribute('aria-live', 'polite'); document.body.appendChild(t); }
    t.textContent = msg; requestAnimationFrame(() => t.classList.add('on'));
    clearTimeout(toastTm); toastTm = setTimeout(() => t.classList.remove('on'), ms);
  }

  /* ── 3. 스와이프 ──
     · 세로 스크롤과 헷갈리지 않게: 가로 이동이 세로의 1.5배 이상, 60px 이상, 0.7초 이내일 때만.
     · 가로로 스크롤되는 영역·입력칸·지도·[data-noswipe] 안에서 시작하면 무시.
     · 화면 왼쪽 끝 24px 에서 시작하면 무시 (사파리 뒤로 가기 동작과 겹침). */
  function hScrollable(n, stop) {
    for (; n && n !== stop && n.nodeType === 1; n = n.parentElement) {
      if (n.matches('[data-noswipe],input,textarea,select,.ak-hscroll,.leaflet-container,canvas')) return true;
      if (n.scrollWidth > n.clientWidth + 4 && /(auto|scroll)/.test(getComputedStyle(n).overflowX)) return true;
    }
    return false;
  }
  function swipe(el, { onNext, onPrev, min = 60 } = {}) {
    el = $(el); let x0 = null, y0 = 0, t0 = 0;
    el.addEventListener('touchstart', e => {
      x0 = null; if (e.touches.length !== 1) return;
      const t = e.touches[0]; if (t.clientX < 24 || hScrollable(e.target, el)) return;
      x0 = t.clientX; y0 = t.clientY; t0 = Date.now();
    }, { passive: true });
    el.addEventListener('touchend', e => {
      if (x0 == null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
      if (Math.abs(dx) < min || Math.abs(dx) < Math.abs(dy) * 1.5 || Date.now() - t0 > 700) return;
      (dx < 0 ? onNext : onPrev)?.();
    }, { passive: true });
    el.addEventListener('touchcancel', () => { x0 = null; }, { passive: true });
  }
  /* 탭바(.ak-tabs button[data-tab]) + 내용(render) + 스와이프를 한 번에 연결 */
  function tabs({ bar = '.ak-tabs', view = '#sc', ids, start, render, remember = 'ak-tab' }) {
    bar = $(bar); view = $(view);
    let cur = start || ids[0];
    try { const s = localStorage.getItem(remember); if (remember && ids.includes(s)) cur = s; } catch (e) {}
    function go(id, dir) {
      if (!ids.includes(id)) return;
      if (dir == null) dir = Math.sign(ids.indexOf(id) - ids.indexOf(cur));
      cur = id; try { remember && localStorage.setItem(remember, id); } catch (e) {}
      bar?.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
      render(id); view.scrollTop = 0;
      view.classList.remove('ak-in-l', 'ak-in-r');
      if (dir) { void view.offsetWidth; view.classList.add(dir > 0 ? 'ak-in-l' : 'ak-in-r'); }
    }
    bar?.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
    swipe(view, {
      onNext: () => { const i = ids.indexOf(cur); if (i < ids.length - 1) go(ids[i + 1], 1); },
      onPrev: () => { const i = ids.indexOf(cur); if (i > 0) go(ids[i - 1], -1); },

function jsonp(url, body) {

    const cb = 'cb' + Date.now() + Math.floor(Math.random() * 1e4), sc = document.createElement('script');
    const done = () => { delete window[cb]; sc.remove(); clearTimeout(tm); };
    const tm = setTimeout(() => { done(); no(new Error('시간 초과')); }, 45000);
    window[cb] = j => { done(); ok(j); }; sc.onerror = () => { done(); no(new Error('연결 실패')); };

  });
}

}

    ${c.seoul ? '<p class="ak-center">올림픽대로·서부간선도로 같은 서울 도로의 사고·공사도 받아요.</p></div>' : `<ol class="steps"><li><b>data.seoul.go.kr</b>(서울 열린데이터광장)에 로그인 → 위쪽 <b>인증키 신청</b> → <b>일반 인증키</b>를 신청하면 바로 나와요 (사용 목적: 개인 출퇴근 정보).</li>
      <li>서버 편집기 → 프로젝트 설정 → 스크립트 속성에 <code>SEOUL_KEY</code> 로 넣어요.</li></ol>
    <p class="note" style="margin-bottom:0">키가 없으면 고속도로(한국도로공사) 정보만 보여요.</p></div>`}`;
  return (S.demo ? server : '') + widget + places + car + look + days + kakao + jsCard + exCard + seoulCard + (S.demo ? '' : server) + `<p class="diag">${AppKit.env(BUILD)}</p>`;
}

/* ── 탭 ── */
const sheet = AppKit.sheet('#sheet');
const tabs = AppKit.tabs({
  ids: ['now', 'hw', 'alarm', 'set'],
  render(id) {
    const sc = document.getElementById('sc');
    sc.innerHTML = id === 'now' ? viewNow() : id === 'hw' ? viewHw() : id === 'alarm' ? viewAlarm() : viewSet();
    if (id === 'hw' && !S.ex) loadEx();
    if (id === 'set' && !S.wl) fetch('widget-loader.txt?t=' + Date.now()).then(r => r.ok ? r.text() : null).then(t => { S.wl = t; }).catch(() => {});
    if (id === 'now' || id === 'hw') requestAnimationFrame(drawMaps);
  },
});

/* ── 누르기 ── */
document.addEventListener('click', async e => {
  const q = s => e.target.closest(s);
  let b;
  if (q('#refresh')) return refresh();
  if ((b = q('[data-route]'))) { e.preventDefault(); S.route = b.dataset.route === 'auto' ? null : b.dataset.route; S.sel = null; S.focus = null; S.base = 'now'; tabs.redraw(); return refresh(); }
  if ((b = q('[data-dest]'))) { S.dest = b.dataset.dest; S.sel = null; S.sig = null; tabs.redraw(); return refresh(); }
  if ((b = q('[data-base]'))) { S.base = b.dataset.base; S.sel = null; tabs.redraw(); return refresh(); }
  if ((b = q('[data-sel]'))) { S.sel = +b.dataset.sel; document.querySelectorAll('.bars button').forEach((x, i) => x.classList.toggle('sel', i === S.sel)); document.getElementById('pick').innerHTML = pickLine(S.data); return; }
  if ((b = q('[data-act="retry"]'))) return refresh();
  if ((b = q('[data-act="wcopy"]'))) {
    const c = conn();
    if (!S.wl) S.wl = await fetch('widget-loader.txt?t=' + Date.now()).then(r => r.text()).catch(() => null);
    if (!S.wl || !S.wl.includes('const PIN = "";')) return AppKit.toast('코드를 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요');
    let t = S.wl.replace('const PIN = "";', 'const PIN = ' + JSON.stringify(c.key) + ';');
    if (c.url) t = t.replace(/const SERVER = "[^"]*";/, 'const SERVER = ' + JSON.stringify(c.url) + ';');
    return AppKit.copy(t);
  }
  if ((b = q('[data-act="cfg"]'))) { S.cfgErr = null; tabs.redraw(); return loadCfg(); }
  if ((b = q('[data-focus]'))) { const f = b.dataset.focus; S.focus = f && S.focus?.n !== f ? { n: f } : null; tabs.redraw();
    document.querySelector('[data-map]')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
  if ((b = q('.tbar .tr')) && S.data?.path?.length) {
    const r = b.getBoundingClientRect(), f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), P = S.data.path, tot = P.reduce((a, x) => a + x.d, 0);
    let at = 0, i = P.findIndex(x => (at += x.d) >= f * tot); if (i < 0) i = P.length - 1;
    S.focus = S.focus?.i === i ? null : { i, pos: f * 100, at: pointAt(S.data, f) }; tabs.redraw();
    document.querySelector('.mapw')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
  if ((b = q('[data-hwpin]'))) { hwPick(+b.dataset.hwpin, 'map'); return; }
  if ((b = q('[data-hwrow]'))) { const i = +b.dataset.hwrow; if (S.ex?.items[i]?.lat == null) { AppKit.toast('이 안내는 위치 정보가 없어 지도에 없어요'); return; } hwPick(i, 'list'); return; }
  if ((b = q('[data-pop]'))) { const i = +b.dataset.pop, kind = b.closest('[data-hwmap]') ? 'hw' : 'route'; openPop(i, kind); return; }
  if ((b = q('[data-popx]'))) { closePop(); return; }
  if ((b = q('[data-inc]'))) { const i = +b.dataset.inc, x = incOf(S.data)[i]; S.focus = S.focus?.inc === i || !x ? null : { inc: i, pt: [x.lon, x.lat], name: `${x.road} ${exLabel(x)}` }; tabs.redraw();
    document.querySelector('.mapw')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return; }
  if ((b = q('[data-hwf]'))) { S.hwF = b.dataset.hwf; S.hwSel = null; tabs.redraw(); return; }
  if ((b = q('[data-act="ex"]'))) { S.exErr = null; tabs.redraw(); return loadEx(); }
  if ((b = q('[data-bigmap]'))) { const m = b.closest('.mapw').querySelector('[data-map],[data-hwmap]'); m.classList.toggle('big'); m.style.height = m.classList.contains('big') ? '62vh' : m.dataset.h + 'px'; drawMaps(); if (m.classList.contains('big')) m.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  if ((b = q('[data-traffic]'))) { const on = !LS.get('traffic', true); LS.set('traffic', on); b.classList.toggle('on', on); const m = b.closest('.mapw').querySelector('[data-map]')._map;
    if (m) on ? m.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC) : m.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC); AppKit.toast(on ? '주변 도로 교통도 보여 줘요' : '내 길만 보여 줘요'); return; }
  if ((b = q('[data-ev]'))) { const v = b.dataset.ev === '1'; LS.set('ev', v); if (S.cfg) S.cfg.ev = v; b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    AppKit.toast(v ? `전기차 통행료(${Math.round(evRate() * 100)}% 할인)로 보여 줄게요` : '일반 통행료로 보여 줄게요'); api('save', { ev: v }).catch(er => AppKit.toast(er.message)); return; }
  if ((b = q('[data-seg]'))) {
    const k = b.dataset.seg, v = +b.dataset.v; LS.set(k, v); if (S.cfg) S.cfg[k] = v;
    b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    AppKit.toast(k === 'step' ? `이제 ${v}분 간격으로 살펴볼게요` : `이제 앞으로 ${v}시간을 살펴볼게요`);
    api('save', { [k]: v }).catch(er => AppKit.toast(er.message)); S.sig = null; refresh(true); return;
  }
  if ((b = q('[data-act="test"]'))) {
    try { const r = await api('test'); AppKit.toast(r.sent?.length ? `${r.sent.join('·')}(으)로 보냈어요` : '보내지 못했어요: ' + (r.reason || '텔레그램 연결을 확인해 주세요'), 3200); }
    catch (er) { AppKit.toast(er.message); } return;
  }
  if ((b = q('[data-act="conn"]'))) {
    const url = document.getElementById('cUrl').value.trim(), key = document.getElementById('cKey').value.trim();
    if (url && !/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)) return AppKit.toast('서버 주소는 https://script.google.com/… 으로 시작해요');
    LS.set('conn', { url, key }); S.demo = !url || location.hash.startsWith('#demo'); LS.del?.('data'); S.data = null; S.cfg = null; S.sig = null;
    if (!url) { AppKit.toast('예시로 보여 드릴게요'); }
    try { await loadCfg(); if (!S.demo && S.cfg) AppKit.toast('서버에 연결했어요'); } catch (er) {}
    tabs.redraw(); refresh(true); return;
  }
  if ((b = q('[data-act="places"]'))) {
    const places = {}; document.querySelectorAll('[data-place]').forEach(i => { places[i.dataset.place] = i.value.trim(); });
    if (Object.values(places).some(v => !v)) return AppKit.toast('세 곳을 모두 넣어 주세요');
    if (Object.values(places).some(v => v.length < 2)) return AppKit.toast('주소나 건물 이름으로 넣어 주세요 (두 글자 이상)');
    try { const r = await api('places', { places }); S.cfg.places = places; S.found = r.found || null; AppKit.toast('장소를 찾아 저장했어요', 2600); tabs.redraw(); S.sig = null; refresh(true); }
    catch (er) { AppKit.toast(er.message, 3600); } return;
  }
  if ((b = q('[data-act="addOff"]'))) {
    const v = document.getElementById('offIn').value; if (!/^\d{4}-\d\d-\d\d$/.test(v)) return AppKit.toast('날짜를 골라 주세요');
    const list = [...new Set([...(S.cfg.offDays || []), v])].filter(k => k >= kstKey(NOW())).sort();
    S.cfg.offDays = list; LS.set('offDays', list); tabs.redraw(); AppKit.toast(`${+v.slice(5, 7)}월 ${+v.slice(8)}일을 쉬는 날로 넣었어요`);
    api('save', { offDays: list }).catch(er => AppKit.toast(er.message)); return;
  }
  if ((b = q('[data-deloff]'))) {
    if (!AppKit.sure(b, '뺄까요?')) return;
    const list = (S.cfg.offDays || []).filter(k => k !== b.dataset.deloff); S.cfg.offDays = list; LS.set('offDays', list); tabs.redraw(); AppKit.toast('뺐어요');
    api('save', { offDays: list }).catch(er => AppKit.toast(er.message)); return;
  }
});
/* 알림 켜기·시각은 누르는 즉시 저장 */
document.addEventListener('change', e => {
  const on = e.target.closest('[data-aon]'), tm = e.target.closest('[data-atime]');
  if (!on && !tm) return;
  const k = (on || tm).dataset.aon || (on || tm).dataset.atime, a = S.cfg.alerts[k] = S.cfg.alerts[k] || {};
  if (on) { a.on = on.checked; const ti = document.querySelector(`[data-atime="${k}"]`); if (ti) ti.disabled = !a.on; }
  if (tm) { if (!/^\d\d:\d\d$/.test(tm.value)) return; a.time = tm.value; }
  const name = ALERTS.find(x => x.k === k).t;
  AppKit.toast(a.on ? `${name}: ${a.time}에 보낼게요` : `${name}을 껐어요`);
  api('save', { alerts: { [k]: a } }).catch(er => AppKit.toast(er.message));
});

/* 5분마다, 그리고 다른 앱에 갔다 돌아오면 조용히 새로고침 (카카오 호출을 아끼려고 간격을 넉넉히) */
AppKit.poll(() => { refresh(true); loadEx(); }, 5 * 60e3);
if (LS.get('justLinked')) { LS.del('justLinked'); setTimeout(() => AppKit.toast('서버에 연결했어요'), 600); }
if (S.data) AppKit.bootDone();
loadCfg();
loadEx();
refresh().finally(AppKit.bootDone);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
