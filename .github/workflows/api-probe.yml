# 외부 교통 API 응답 모양 살펴보기 — 시험용 키(test)로 공개 자료만 받아 probe 브랜치에 저장한다 (작업 컴퓨터에서는 이 사이트들에 접속이 막혀 있어서)
name: API 살펴보기
on:
  push:
    branches: [main]
    paths: ['.github/workflows/api-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 받기
        run: |
          mkdir out && cd out
          g() { curl -sSL -m 40 -A 'Mozilla/5.0' "$2" -o "$1" -w "$1 %{http_code} %{size_download}\n" || echo "$1 실패"; }
          {
          g kakao-nothing.txt 'https://example.com/'
          g its-event-9443.json 'https://openapi.its.go.kr:9443/eventInfo?apiKey=test&type=all&eventType=all&minX=126.8&maxX=127.2&minY=37.2&maxY=37.6&getType=json'
          g its-event-www.json 'https://www.its.go.kr:9443/eventInfo?apiKey=test&type=all&eventType=all&minX=126.8&maxX=127.2&minY=37.2&maxY=37.6&getType=json'
          g its-event-page.html 'https://www.its.go.kr/opendata/opendataList?service=event'
          g its-intro.html 'https://www.its.go.kr/opendata/'
          g ex-sms.json 'https://data.ex.co.kr/openapi/burstInfo/realTimeSms?key=test&type=json'
          g ex-intro.html 'https://data.ex.co.kr/openapi/intro/introduce01'
          g ex-api0611.html 'https://data.ex.co.kr/openapi/basicinfo/openApiInfoM?apiId=0611'
          g ex-sms-all.json 'https://data.ex.co.kr/openapi/burstInfo/realTimeSms?key=test&type=json&numOfRows=200&pageNo=1'
          g ex-list.html 'https://data.ex.co.kr/openapi/basicinfo/openApiInfo'
          for p in 2 3 4 5 6; do g ex-list$p.html "https://data.ex.co.kr/openapi/basicinfo/openApiInfo?pageIndex=$p"; done
          } > status.txt 2>&1
          # HTML 은 글자만 남겨 읽기 쉽게
          for f in *.html; do python3 - "$f" <<'PY'
          import re,sys,html
          s=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          links=sorted(set(re.findall(r'(?:https?://[^"\' <>]*)?/openapi/[^"\' <>]+',s)))
          s=re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>',' ',s); s=html.unescape(re.sub(r'<[^>]+>',' ',s)); s=re.sub(r'\s+',' ',s)
          open(sys.argv[1]+'.txt','w').write(s[:60000]+'\n\nLINKS:\n'+'\n'.join(links))
          PY
          done
          cat status.txt
      - name: 저장
        run: |
          cd out && git init -q && git checkout -q -b probe && git add -A
          git -c user.name=probe -c user.email=actions@users.noreply.github.com commit -qm "API 살펴보기 결과"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe
